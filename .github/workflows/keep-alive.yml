name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -X POST https://pqc-readiness-scanner.onrender.com/scan \
            -H "Content-Type: application/json" \
            -d '{"domain": "google.com"}'
